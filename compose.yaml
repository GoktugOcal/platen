services:
  platen:
    build:
      context: .
      target: app
    image: platen:latest
    container_name: platen
    # Host networking lets CUPS and sane-airscan find printers/scanners via mDNS.
    # The bundled CUPS listens only on a unix socket, so host port 631 stays free.
    network_mode: host
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PLATEN_PORT: ${PLATEN_PORT:-8631}
      TZ: ${TZ:-UTC}
    volumes:
      - platen-data:/data
      # D-Bus is used to reach the host's avahi-daemon for mDNS discovery.
      - /run/dbus:/run/dbus

  # Optional: printing Office documents (docx, xlsx, odt, ...).
  # Start with:  docker compose --profile office up -d
  # and set PLATEN_GOTENBERG_URL=http://127.0.0.1:3100 in .env
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: platen-gotenberg
    profiles: [office]
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3000"
    mem_limit: 768m

volumes:
  platen-data:
