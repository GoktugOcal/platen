[project]
name = "platen"
version = "0.3.0"
description = "Self-hosted print & scan manager: CUPS and SANE behind one web UI with a job log."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
# pycups is not on PyPI as a wheel; the container uses Debian's python3-cups.
# img2pdf and pillow are also satisfied by Debian packages inside the container.
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.4",
    "pypdf>=5.0",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "img2pdf>=0.5",
    "pillow>=10.0",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "zeroconf>=0.130",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
