{% extends "base.html" %}
{% block title %}Set up{% endblock %}
{% block content %}
<article style="max-width: 28rem; margin: 2rem auto;">
  <h2>Welcome to Platen</h2>
  <p>Create the first admin account. You can add more users afterwards.</p>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/setup">
    <label>Username
      <input type="text" name="username" value="{{ form.username or 'admin' }}" autocomplete="username" autocapitalize="none" required>
    </label>
    <label>Email <span class="muted">(optional, used for scan-to-email)</span>
      <input type="email" name="email" value="{{ form.email or '' }}" autocomplete="email">
    </label>
    <label>Password <span class="muted">(at least 8 characters)</span>
      <input type="password" name="password" autocomplete="new-password" minlength="8" required>
    </label>
    <label>Repeat password
      <input type="password" name="password2" autocomplete="new-password" minlength="8" required>
    </label>
    <button type="submit">Create admin</button>
  </form>
</article>
{% endblock %}
