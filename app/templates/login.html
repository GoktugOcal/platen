{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="card">
  <div class="card-header"><div><h1 class="card-title" style="font-size:1.25rem">Log in</h1>
    <p class="card-description">Enter your username and password</p></div></div>
  {% if error %}<p class="error" role="alert">{{ icon("circle-alert") }}<span>{{ error }}</span></p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Username
      <input type="text" name="username" value="{{ username }}" autocomplete="username" autocapitalize="none" required autofocus>
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit" style="width:100%">Log in</button>
  </form>
</section>
{% endblock %}
