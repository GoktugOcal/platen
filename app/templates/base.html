<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Platen{% endblock %} · Platen</title>
  <link rel="stylesheet" href="/static/pico.min.css">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header class="container">
    <nav>
      <ul><li><a href="/" class="brand"><strong>Platen</strong></a></li></ul>
      {% set path = request.url.path %}
      {% if user %}
      <ul>
        <li><a href="/print" {% if path.startswith('/print') %}aria-current="page"{% endif %}>Print</a></li>
        <li><a href="/scan" {% if path.startswith('/scan') %}aria-current="page"{% endif %}>Scan</a></li>
        <li><a href="/jobs" {% if path.startswith('/jobs') %}aria-current="page"{% endif %}>Jobs</a></li>
        <li><a href="/stats" {% if path.startswith('/stats') %}aria-current="page"{% endif %}>Stats</a></li>
        <li><a href="/devices" {% if path.startswith('/devices') %}aria-current="page"{% endif %}>Devices</a></li>
        {% if user.is_admin %}<li><a href="/admin/users" {% if path.startswith('/admin') %}aria-current="page"{% endif %}>Users</a></li>{% endif %}
        <li><a href="/account" {% if path.startswith('/account') %}aria-current="page"{% endif %}>{{ user.username }}</a></li>
        <li><form method="post" action="/logout" class="inline"><button class="outline secondary small">Log out</button></form></li>
      </ul>
      {% endif %}
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
